plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.xaan'
version = '0.0.9'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Vault core
    api 'org.springframework.vault:spring-vault-core:3.1.0'

    // Spring context for @Service
    api 'org.springframework:spring-context:6.2.0'

    // BCrypt password hashing (PasswordHasher) - needs no external key, so no Vault dependency
    implementation 'org.springframework.security:spring-security-crypto:6.4.1'

    // MyBatis TypeHandler support (EnvelopeCryptoTypeHandler) - compileOnly so projects that
    // don't use MyBatis aren't forced to pull it in; MyBatis-based consumers already have it
    // on their own runtime classpath
    compileOnly 'org.mybatis:mybatis:3.5.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mybatis:mybatis:3.5.16'
    testImplementation 'com.h2database:h2:2.3.232'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repos/local')
        }
    }
}

test {
    useJUnitPlatform()
}